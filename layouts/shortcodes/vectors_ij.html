{{ if not (.Page.Store.Get "vl-theme") }}{{ .Page.Store.Set "vl-theme" true }}{{ partial "vectorlab-theme.html" . }}{{ end }}
<div id="bl_container" class="vl-root" style="background: var(--vl-bg); color: var(--vl-fg); padding: 25px; border-radius: 20px; max-width: 1050px; font-family: system-ui, sans-serif; box-shadow: var(--vl-shadow); margin: 20px auto; border: 1px solid var(--vl-panel); user-select: none;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--vl-panel); padding-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h2 style="margin: 0; color: var(--vl-yellow); font-size: 2rem; letter-spacing: -1.5px;">&lt;BasisLab /&gt;</h2>
            <button id="bl_resetBtn" style="background: var(--vl-panel); color: var(--vl-muted); border: 1px solid var(--vl-border); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem;">RESET BASIS</button>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <label class="bl_custom-checkbox"><input type="checkbox" id="bl_showGrid" checked><span>Basis Grid</span></label>
            <label class="bl_custom-checkbox"><input type="checkbox" id="bl_showComponents" checked><span>Components</span></label>
        </div>
    </div>

    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 450px; position: relative;">
            <canvas id="bl_basisCanvas" width="500" height="500" style="background: var(--vl-deep); border-radius: 12px; border: 1px solid var(--vl-border); width: 100%; height: auto; cursor: crosshair;"></canvas>
            <div id="bl_equationOverlay" style="position: absolute; bottom: 20px; left: 20px; background: color-mix(in srgb, var(--vl-bg) 90%, transparent); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--vl-yellow); font-family: monospace; font-size: 1.1rem;">
                <span style="color: var(--vl-yellow);">C</span> = <span id="bl_scalarAVal" style="color:var(--vl-blue)">1.0</span><span style="color:var(--vl-blue)">A</span> + <span id="bl_scalarBVal" style="color:var(--vl-red)">1.0</span><span style="color:var(--vl-red)">B</span>
            </div>
        </div>

        <div style="width: 420px; display: flex; flex-direction: column; gap: 15px;">
            <div style="background: var(--vl-panel); padding: 20px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--vl-yellow) 27%, transparent);">
                <h4 style="margin: 0 0 15px 0; color: var(--vl-yellow); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Linear Combination Scalars</h4>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="bl_scalar-row">
                        <span style="color: var(--vl-blue); font-weight: bold; width: 80px;">Scalar (a):</span>
                        <input type="range" id="bl_input_a" min="-3" max="3" step="0.1" value="1" style="flex: 1;">
                        <span id="bl_label_a" style="width: 40px; text-align: right; font-family: monospace;">1.0</span>
                    </div>
                    <div class="bl_scalar-row">
                        <span style="color: var(--vl-red); font-weight: bold; width: 80px;">Scalar (b):</span>
                        <input type="range" id="bl_input_b" min="-3" max="3" step="0.1" value="1" style="flex: 1;">
                        <span id="bl_label_b" style="width: 40px; text-align: right; font-family: monospace;">1.0</span>
                    </div>
                </div>
            </div>

            <div style="background: var(--vl-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--vl-border);">
                <h4 style="margin: 0 0 15px 0; color: var(--vl-green); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Transformation Matrix [A | B]</h4>
                <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
                    <div style="font-size: 3rem; color: var(--vl-faint);">[</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <input type="text" id="bl_m00" class="bl_mat-in" style="color: var(--vl-blue);">
                        <input type="text" id="bl_m01" class="bl_mat-in" style="color: var(--vl-red);">
                        <input type="text" id="bl_m10" class="bl_mat-in" style="color: var(--vl-blue);">
                        <input type="text" id="bl_m11" class="bl_mat-in" style="color: var(--vl-red);">
                    </div>
                    <div style="font-size: 3rem; color: var(--vl-faint);">]</div>
                </div>
                <div style="text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--vl-faint); font-family: monospace;">
                    Det: <span id="bl_detVal">1.00</span>
                </div>
            </div>

            <div style="background: var(--vl-deep); padding: 20px; border-radius: 12px; border: 1px solid var(--vl-border);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="color: var(--vl-yellow); font-weight: bold;">Vector C Result</span>
                    <span id="bl_vecC_coords" style="font-family: monospace; color: var(--vl-muted);">(1.00, 1.00)</span>
                </div>
                <div style="font-size: 0.85rem; color: var(--vl-faint); line-height: 1.5;">
                    <div id="bl_calcStep1"></div>
                    <div id="bl_calcStep2"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bl_custom-checkbox { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--vl-muted); font-size: 0.9rem; }
    .bl_custom-checkbox input { appearance: none; width: 16px; height: 16px; border: 2px solid var(--vl-border); border-radius: 4px; background: var(--vl-bg); cursor: pointer; position: relative; }
    .bl_custom-checkbox input:checked { background: var(--vl-yellow); border-color: var(--vl-yellow); }
    .bl_custom-checkbox input:checked::after { content: '✓'; position: absolute; color: var(--vl-on-accent); font-size: 11px; font-weight: bold; left: 2px; top: -1px; }
    .bl_scalar-row { display: flex; align-items: center; gap: 10px; }
    #bl_container input[type=range] { accent-color: var(--vl-yellow); cursor: pointer; }
    .bl_mat-in { 
        width: 60px; background: var(--vl-bg); border: 1px solid var(--vl-border); 
        border-radius: 4px; padding: 8px; text-align: center; 
        font-family: monospace; font-size: 1.1rem; outline: none;
    }
    .bl_mat-in:focus { border-color: var(--vl-yellow); }
</style>

<script>
(function() {
    const canvas = document.getElementById('bl_basisCanvas');
    const ctx = canvas.getContext('2d');
    const center = 250, scale = 70;

    // Colours are theme tokens (--vl-*), resolved on every render so the site toggle applies live.
    const root = document.getElementById('bl_container');
    let P = {};
    const col = (c) => P[c] || c;

    let basis = {
        A: {x: 1, y: 0, color: 'blue'},
        B: {x: 0, y: 1, color: 'red'}
    };
    let activeBasis = null;

    // Grab elements
    const inputA = document.getElementById('bl_input_a');
    const inputB = document.getElementById('bl_input_b');
    const showGrid = document.getElementById('bl_showGrid');
    const showComp = document.getElementById('bl_showComponents');
    const m00 = document.getElementById('bl_m00');
    const m01 = document.getElementById('bl_m01');
    const m10 = document.getElementById('bl_m10');
    const m11 = document.getElementById('bl_m11');

    function resetBasis() {
        basis.A = {x: 1, y: 0, color: 'blue'};
        basis.B = {x: 0, y: 1, color: 'red'};
        inputA.value = 1;
        inputB.value = 1;
        render();
    }

    function updateMatrix() {
        basis.A.x = parseFloat(m00.value) || 0;
        basis.B.x = parseFloat(m01.value) || 0;
        basis.A.y = parseFloat(m10.value) || 0;
        basis.B.y = parseFloat(m11.value) || 0;
        render('skip-mat');
    }

    function drawArrow(x0, y0, x1, y1, color, width = 4, alpha = 1, dash = null) {
        ctx.save();
        ctx.globalAlpha = alpha;
        color = col(color);
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
        if (dash) { ctx.setLineDash(dash); ctx.lineCap = 'round'; }
        // stop the shaft at the base of the head so dots don't poke through it
        const len = Math.hypot(x1 - x0, y1 - y0), cut = dash && len > 12 ? 10 / len : 0;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - (x1 - x0) * cut, y1 - (y1 - y0) * cut); ctx.stroke();
        ctx.setLineDash([]);
        const ang = Math.atan2(y0 - y1, x1 - x0);
        ctx.beginPath(); ctx.moveTo(x1, y1);
        ctx.lineTo(x1-12*Math.cos(ang-Math.PI/6), y1+12*Math.sin(ang-Math.PI/6));
        ctx.lineTo(x1-12*Math.cos(ang+Math.PI/6), y1+12*Math.sin(ang+Math.PI/6));
        ctx.fill();
        ctx.restore();
    }

    function render(mode) {
        P = VLTheme.read(root, ['blue', 'red', 'yellow', 'green', 'grid', 'grid-basis']);
        ctx.clearRect(0, 0, 500, 500);
        const a = parseFloat(inputA.value);
        const b = parseFloat(inputB.value);

        ctx.strokeStyle = P.grid; ctx.lineWidth = 1;
        for(let i=-10; i<=10; i++) {
            ctx.beginPath(); ctx.moveTo(center+i*scale, 0); ctx.lineTo(center+i*scale, 500); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, center+i*scale); ctx.lineTo(500, center+i*scale); ctx.stroke();
        }

        if(showGrid.checked) {
            ctx.strokeStyle = P['grid-basis']; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
            for(let i=-5; i<=5; i++) {
                ctx.beginPath();
                ctx.moveTo(center + (i*basis.B.x - 10*basis.A.x)*scale, center - (i*basis.B.y - 10*basis.A.y)*scale);
                ctx.lineTo(center + (i*basis.B.x + 10*basis.A.x)*scale, center - (i*basis.B.y + 10*basis.A.y)*scale);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(center + (i*basis.A.x - 10*basis.B.x)*scale, center - (i*basis.A.y - 10*basis.B.y)*scale);
                ctx.lineTo(center + (i*basis.A.x + 10*basis.B.x)*scale, center - (i*basis.A.y + 10*basis.B.y)*scale);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        const Ax = basis.A.x * scale, Ay = -basis.A.y * scale;
        const Bx = basis.B.x * scale, By = -basis.B.y * scale;
        
        if(showComp.checked) {
            drawArrow(center, center, center + a*Ax, center + a*Ay, basis.A.color, 2, 0.4);
            drawArrow(center + a*Ax, center + a*Ay, center + a*Ax + b*Bx, center + a*Ay + b*By, basis.B.color, 2, 0.4);
        }

        drawArrow(center, center, center + Ax, center + Ay, basis.A.color, 5);
        drawArrow(center, center, center + Bx, center + By, basis.B.color, 5);

        const Cx = a*basis.A.x + b*basis.B.x;
        const Cy = a*basis.A.y + b*basis.B.y;
        // C is the result, not a handle: dotted and dimmed so it doesn't look draggable
        drawArrow(center, center, center + Cx*scale, center - Cy*scale, 'yellow', 5, 0.6, [0.5, 9]);

        document.getElementById('bl_label_a').innerText = a.toFixed(1);
        document.getElementById('bl_label_b').innerText = b.toFixed(1);
        document.getElementById('bl_scalarAVal').innerText = a.toFixed(1);
        document.getElementById('bl_scalarBVal').innerText = b.toFixed(1);
        document.getElementById('bl_vecC_coords').innerText = `(${Cx.toFixed(2)}, ${Cy.toFixed(2)})`;
        
        if(mode !== 'skip-mat') {
            m00.value = basis.A.x.toFixed(2);
            m01.value = basis.B.x.toFixed(2);
            m10.value = basis.A.y.toFixed(2);
            m11.value = basis.B.y.toFixed(2);
        }

        const det = (basis.A.x * basis.B.y) - (basis.B.x * basis.A.y);
        document.getElementById('bl_detVal').innerText = det.toFixed(2);
        document.getElementById('bl_detVal').style.color = Math.abs(det) < 0.01 ? P.red : P.green;

        document.getElementById('bl_calcStep1').innerText = `x: ${a.toFixed(1)}(${basis.A.x.toFixed(2)}) + ${b.toFixed(1)}(${basis.B.x.toFixed(2)}) = ${Cx.toFixed(2)}`;
        document.getElementById('bl_calcStep2').innerText = `y: ${a.toFixed(1)}(${basis.A.y.toFixed(2)}) + ${b.toFixed(1)}(${basis.B.y.toFixed(2)}) = ${Cy.toFixed(2)}`;
    }

    // Event Listeners
    document.getElementById('bl_resetBtn').addEventListener('click', resetBasis);
    [inputA, inputB, showGrid, showComp].forEach(el => el.addEventListener('input', () => render()));
    [m00, m01, m10, m11].forEach(el => el.addEventListener('input', updateMatrix));

    canvas.addEventListener('mousedown', e => {
        const r = canvas.getBoundingClientRect(), mx = (e.clientX-r.left)*(500/r.width), my = (e.clientY-r.top)*(500/r.height);
        if(Math.sqrt((mx-(center+basis.A.x*scale))**2+(my-(center-basis.A.y*scale))**2) < 25) activeBasis = 'A';
        else if(Math.sqrt((mx-(center+basis.B.x*scale))**2+(my-(center-basis.B.y*scale))**2) < 25) activeBasis = 'B';
    });
    window.addEventListener('mousemove', e => {
        if(!activeBasis) return;
        const r = canvas.getBoundingClientRect(), 
              x = Math.round((((e.clientX-r.left)*(500/r.width)-center)/scale)*4)/4, 
              y = Math.round((-((e.clientY-r.top)*(500/r.height)-center)/scale)*4)/4;
        basis[activeBasis].x = x; basis[activeBasis].y = y;
        render();
    });
    window.addEventListener('mouseup', () => activeBasis = null);

    // Only A and B are draggable: show a grab cursor over their tips.
    canvas.addEventListener('mousemove', e => {
        if (activeBasis) { canvas.style.cursor = 'grabbing'; return; }
        const r = canvas.getBoundingClientRect(), mx = (e.clientX-r.left)*(500/r.width), my = (e.clientY-r.top)*(500/r.height);
        const near = ['A', 'B'].some(k => Math.hypot(mx-(center+basis[k].x*scale), my-(center-basis[k].y*scale)) < 25);
        canvas.style.cursor = near ? 'grab' : 'crosshair';
    });

    VLTheme.onChange(() => render());
    render();
})();
</script>
